<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520">
  <rect width="940" height="520" fill="white"/>
  <rect x="50" y="60" width="380" height="390" rx="18" fill="#eaf3ff" stroke="#223" stroke-width="3"/>
  <rect x="510" y="60" width="380" height="390" rx="18" fill="#eefde8" stroke="#223" stroke-width="3"/>

  <text x="240" y="110" text-anchor="middle" font-family="serif" font-size="34">SARSA (on-policy)</text>
  <text x="240" y="160" text-anchor="middle" font-family="serif" font-size="24">Target uses next sampled action</text>
  <text x="240" y="215" text-anchor="middle" font-family="monospace" font-size="24">R + γ Q(S', A')</text>
  <text x="240" y="270" text-anchor="middle" font-family="serif" font-size="22">Learns behaviour policy value</text>
  <text x="240" y="310" text-anchor="middle" font-family="serif" font-size="22">Often more conservative</text>

  <text x="700" y="110" text-anchor="middle" font-family="serif" font-size="34">Q-learning (off-policy)</text>
  <text x="700" y="160" text-anchor="middle" font-family="serif" font-size="24">Target uses greedy backup</text>
  <text x="700" y="215" text-anchor="middle" font-family="monospace" font-size="24">R + γ max_a Q(S',a)</text>
  <text x="700" y="270" text-anchor="middle" font-family="serif" font-size="22">Learns greedy target policy</text>
  <text x="700" y="310" text-anchor="middle" font-family="serif" font-size="22">Often faster, more optimistic</text>

  <line x1="470" y1="95" x2="470" y2="440" stroke="#666" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="470" y="490" text-anchor="middle" font-family="serif" font-size="28">One-step TD control methods</text>
</svg>
