<h1 id="todays-question">Today’s question</h1>
<blockquote>
<p>How can experience tell us which way to change a policy?</p>
</blockquote>
<p>By the end, you should be able to:</p>
<ul>
<li>explain the REINFORCE update and check its direction</li>
<li>describe how a baseline and a critic reduce variance</li>
<li>explain why large policy updates can be risky</li>
<li>compare TRPO’s trust region with PPO’s clipped objective</li>
</ul>
</section>

<h1 id="why-learn-a-stochastic-policy">Why learn a stochastic policy?</h1>
<p>In rock–paper–scissors, a predictable player can be exploited.</p>
<p>The uniform policy assigns probability <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.566ex;" xmlns="http://www.w3.org/2000/svg" width="3.394ex" height="2.262ex" role="img" focusable="false" viewBox="0 -750 1500 1000"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mn"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 315 52T339 48T401 46H427V0H416Q395 3 257 3Q121 3 100 0H88V46H114Q136 46 152 46T177 47T193 50T201 52T207 57T213 61V578Z"></path></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(500,0)"><g data-mml-node="mo"><path data-c="2F" d="M423 750Q432 750 438 744T444 730Q444 725 271 248T92 -240Q85 -250 75 -250Q68 -250 62 -245T56 -231Q56 -221 230 257T407 740Q411 750 423 750Z"></path></g></g><g data-mml-node="mn" transform="translate(1000,0)"><path data-c="33" d="M127 463Q100 463 85 480T69 524Q69 579 117 622T233 665Q268 665 277 664Q351 652 390 611T430 522Q430 470 396 421T302 350L299 348Q299 347 308 345T337 336T375 315Q457 262 457 175Q457 96 395 37T238 -22Q158 -22 100 21T42 130Q42 158 60 175T105 193Q133 193 151 175T169 130Q169 119 166 110T159 94T148 82T136 74T126 70T118 67L114 66Q165 21 238 21Q293 21 321 74Q338 107 338 175V195Q338 290 274 322Q259 328 213 329L171 330L168 332Q166 335 166 348Q166 366 174 366Q202 366 232 371Q266 376 294 413T322 525V533Q322 590 287 612Q265 626 240 626Q208 626 181 615T143 592T132 580H135Q138 579 143 578T153 573T165 566T175 555T183 540T186 520Q186 498 172 481T127 463Z"></path></g></g></g></svg></mjx-container> to each action. Randomness is the strategy.</p>
<p>Policy-based methods can represent this directly. A greedy value-based policy tends to become nearly deterministic.</p>
</section>

<h1 id="why-the-raw-return-is-noisy">Why the raw return is noisy</h1>
<p>The return includes reward variation that may have little to do with the action at this step.</p>
<p>Two episodes can take the same action in the same state but have very different returns.</p>
<p>High variance makes the gradient estimate jump around, so learning can be slow.</p>
<p>Can we measure whether the outcome was good relative to what this state usually produces?</p>
</section>

<h1 id="a-critic-supplies-the-baseline">A critic supplies the baseline</h1>
<p>The <strong>actor</strong> chooses actions; the <strong>critic</strong> estimates how good they are.</p>
<div class="ac-loop">
  <span class="state">State sₜ</span><b class="to-actor">→</b><span class="actor">Actor<br />πθ</span><b class="to-env">→</b><span class="experience">Action aₜ<br />Reward, next state</span>
  <span class="critic">Critic<br />Vw(s)</span><b class="up">↑</b><span class="signal">TD error / advantage</span>
</div>
<p>The critic learns about the current policy. Its estimate gives the actor a lower-variance learning signal.</p>
</section>

<h1 id="the-step-size-problem">The step-size problem</h1>
<p>A policy gradient points uphill <strong>near the current policy</strong>.</p>
<p>A large parameter step can change action probabilities sharply, so the data gathered under the old policy may no longer describe the new one.</p>
<p>Too small: progress is slow. Too large: performance can collapse.</p>
<div class="callout">
<p>Can we improve the policy while limiting how far it moves?</p>
</div>
</section>

<table>
<thead>
<tr>
<th></th>
<th>TRPO</th>
<th>PPO</th>

<tr>
<td>Policy change</td>

<h1 id="what-to-check-in-an-implementation">What to check in an implementation</h1>
<ul>
<li><strong>Direction:</strong> positive advantage raises the sampled action’s probability; negative advantage lowers it.</li>
<li><strong>Normalisation:</strong> action probabilities sum to one.</li>
<li><strong>Old policy:</strong> PPO ratios compare the updated policy with the policy that collected the sample.</li>
<li><strong>Bounded change:</strong> monitor KL or clip fraction; a small clipping parameter does not guarantee a small KL.</li>
<li><strong>Critic:</strong> value targets and TD errors have the expected sign and scale.</li>
</ul>
<p>Maths gives us more than an update rule: it gives checks for whether the algorithm is behaving as intended.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="f09aztltmxu9q3vw160jhlp4ewxt2yfynidm4ruw9js" lang="en-GB" data-marpit-pagination="21" style="--paginate:true;--theme:f09aztltmxu9q3vw160jhlp4ewxt2yfynidm4ruw9js;" data-marpit-pagination-total="22">
<h1 id="takeaways">Takeaways</h1>
<ul>
<li>REINFORCE reinforces actions using sampled returns.</li>
<li>A baseline or critic turns return into a relative learning signal.</li>
<li>Actor–critic trades some bias for lower variance and faster feedback.</li>
<li>TRPO constrains policy change; PPO clips the surrogate objective.</li>
</ul>
<p>The core question remains: <strong>did the update make a good action more likely, without changing the policy too abruptly?</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="f09aztltmxu9q3vw160jhlp4ewxt2yfynidm4ruw9js" lang="en-GB" data-marpit-pagination="22" style="--paginate:true;--theme:f09aztltmxu9q3vw160jhlp4ewxt2yfynidm4ruw9js;" data-marpit-pagination-total="22">
<h1 id="further-reading">Further reading</h1>
<ul>
<li>Sutton and Barto, <em>Reinforcement Learning: An Introduction</em>, policy-gradient methods</li>
<li>Schulman et al., “Trust Region Policy Optimization” (2015)</li>
<li>Schulman et al., “Proximal Policy Optimization Algorithms” (2017)</li>
</ul>
