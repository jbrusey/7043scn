<h1 id="state-aggregation">State aggregation</h1>
<div class="bins">

<p>Divide the state space into regions and activate one feature per region.</p>
<p><strong>Advantage:</strong> simple, fast, and easy to inspect.</p>
<p><strong>Limitation:</strong> predictions jump at region boundaries. Two nearby states may use different weights.</p>

<h1 id="smoothness-and-discontinuities">Smoothness and discontinuities</h1>
<p>Generalisation helps when nearby states have nearby values.</p>
<p>It can hurt near a sharp boundary:</p>
<div class="boundary"><span>safe</span><b></b><span>failure</span></div>
<p>A small change in state may switch the outcome completely, such as a collision, checkmate, or constraint violation.</p>
<p>Useful representations generalise locally while retaining enough capacity for important boundaries.</p>
</section>

<h1 id="underfitting-and-overfitting">Underfitting and overfitting</h1>
<table>
<thead>
<tr>
<th>Representation</th>
<th>Likely behaviour</th>
</tr>
</thead>
<tbody>
<tr>
<td>Too few broad features</td>
<td>Different states receive nearly the same value</td>
</tr>
<tr>
<td>Useful local features</td>
<td>Experience transfers to relevant neighbours</td>
</tr>
<tr>
<td>Too many narrow features</td>
<td>Learning approaches a sparse table</td>
</tr>
<tr>
<td>Highly flexible nonlinear model</td>
<td>Can fit complex structure, but may be unstable</td>
</tr>
</tbody>
</table>
<p>The best representation supports the distinctions the policy needs to make.</p>
</section>

<ul>

<p>Experience replay stores transitions and samples shuffled minibatches. This improves data reuse and weakens short-term correlation.</p>
<p>Replay does not guarantee stability, but it is an important part of DQN.</p>
</section>

<h1 id="a-dangerous-combination">A dangerous combination</h1>
<p>Instability becomes more likely when three ingredients appear together:</p>
<div class="triad">
  <span>function approximation</span>
  <span>bootstrapping</span>
  <span>off-policy learning</span>
</div>
<p>This combination is often called the <strong>deadly triad</strong>.</p>
<p>Linear on-policy prediction is comparatively well behaved. Deep off-policy control needs additional stabilisation mechanisms.</p>
</section>

<h1 id="from-tables-to-features">From tables to features</h1>
<div class="spectrum">
  <span>table</span><span>state aggregation</span><span>tile coding</span><span>neural network</span>
</div>
<ul>
<li>Approximation replaces stored entries with shared parameters</li>
<li>Linear methods make the effect of each update easy to inspect</li>
<li>Features decide where learning generalises</li>
<li>MC, TD and Sarsa differ mainly in the target they supply</li>
</ul>
<p>The algorithm and representation must be checked together.</p>
</section>

<h1 id="reading-and-practical-work">Reading and practical work</h1>
<p>Sutton and Barto, <em>Reinforcement Learning: An Introduction</em>, 2nd ed.</p>
<ul>
<li>Chapter 9: on-policy prediction with approximation</li>
<li>Chapter 10: on-policy control with approximation</li>
<li>Chapter 11: off-policy approximation</li>
</ul>
<p>Practical: compare a Q-table, simple linear features, and tile-coded linear Sarsa on Mountain Car.</p>
</section>
